<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LYCO 订阅助手</title><link rel="stylesheet" href="popup.css"></head>
<body><header><img src="icons/48.png" width="44" height="44" alt="Lyco 原创角色"><div><small>LAIN42 · LOCAL CONNECTION</small><h1>LYCO 订阅助手</h1></div></header>
<main><section class="status"><span id="indicator"></span><div><strong id="state">读取代理状态…</strong><p id="message" role="status" aria-live="polite"></p><code id="endpoint"></code></div></section>
<form id="connect-form"><label for="connection">桌面客户端连接码</label><p>在 LYCO 客户端连接代理并复制连接码，粘贴到这里。连接码只含本地端口，不含账户密钥。</p><textarea id="connection" rows="3" spellcheck="false" autocomplete="off" required placeholder="粘贴客户端复制的连接码"></textarea><div class="actions"><button id="connect" type="submit">启用浏览器代理</button><button id="disconnect" type="button" class="secondary">关闭 / 恢复原设置</button></div></form>
<section class="membership"><small>一个账户，沿用已有代理订阅</small><h2>订阅与续费</h2><p>在网站选择月卡、90天季卡、120天套餐或年卡。已有有效订阅无需重复购买。</p><div class="actions"><button id="account" class="secondary">我的订阅</button><button id="shop" class="secondary">购买 / 续费</button></div></section>
<footer>扩展仅设置当前浏览器的网页代理，独立环境请使用桌面版。<button id="guide" class="link">查看使用说明 ↗</button></footer></main><script src="popup.js" type="module"></script></body></html>
