name: Mobile subscription core · source build and real routing
on:
  pull_request:
    branches: [main]
    paths: ['mobile/core/**', '.github/workflows/mobile-core.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/core
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - run: go mod tidy
      - run: go test -race -count=1 ./...
      - name: Retain resolved dependency checksums
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-core-lock-${{ github.run_id }}
          path: |
            mobile/core/go.mod
            mobile/core/go.sum
          retention-days: 7
