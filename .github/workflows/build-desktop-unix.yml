name: LYCO Desktop · macOS Linux (GitHub Actions only)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/ui-font/**'
      - '.gitattributes'
      - 'tests/ui-font.test.mjs'
      - 'tests/workbench-ui-font.mjs'
      - 'tests/workspace-*'
      - 'tests/native-workspace-routes.mjs'
      - 'apps/universal/src/product.json'
      - 'tests/product-version.test.js'
      - 'tests/upstream-product-version.test.js'
      - 'scripts/**'
      - 'tests/native-unix-workspaces.mjs'
      - 'tests/proxy-failure-probe.mjs'
      - 'tests/browser-privacy-fixture.mjs'
      - 'tests/connect-handler.mjs'
      - 'tests/core-startup-observer.cjs'
      - '.github/workflows/build-desktop-unix.yml'
  pull_request:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'resources/ui-font/**', '.gitattributes', 'tests/ui-font.test.mjs', 'tests/workbench-ui-font.mjs', 'tests/workspace-*', 'tests/native-workspace-routes.mjs', 'apps/universal/src/product.json', 'tests/product-version.test.js', 'tests/upstream-product-version.test.js', 'tests/native-unix-workspaces.mjs', 'tests/proxy-failure-probe.mjs', 'tests/browser-privacy-fixture.mjs', 'tests/connect-handler.mjs', 'tests/core-startup-observer.cjs', '.github/workflows/build-desktop-unix.yml']
  workflow_dispatch:
    inputs:
      speed_probe:
        description: Fixed production egress read-only probe
        type: choice
        default: none
        options: [none, before, after]
      routes_only:
        description: Verify selected workspace routes without repackaging native browsers
        type: boolean
        default: false
      font_inventory_only:
        description: Inspect original font metadata from the retained e5ed180 archive without building or running a product
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  workspace-routes:
    if: ${{ inputs.font_inventory_only != true && (inputs.speed_probe == '' || inputs.speed_probe == 'none') }}
    name: workspace routes · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04, asset: mihomo-linux-amd64-v1.19.32.gz }
          - { target: macos-arm64, runner: macos-26, asset: mihomo-darwin-arm64-v1.19.32.gz }
          - { target: windows-x64, runner: windows-2022, asset: mihomo-windows-amd64-compatible-v1.19.32.zip }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify ownership, cancellation, fixed selection and core lifecycle
        shell: bash
        run: |
          set -euo pipefail
          node --check src/ui.js
          node --check tests/native-workspace-routes.mjs
          node --test tests/network.test.js tests/profiles.test.js tests/workspace-routes.test.js
      - name: Prepare the same pinned official Mihomo used by desktop packages
        if: matrix.target != 'windows-x64'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lyco-route-test"
          gh release download v1.19.32 -R MetaCubeX/mihomo -p '${{ matrix.asset }}' -D "$RUNNER_TEMP/lyco-route-test"
          gzip -dc "$RUNNER_TEMP/lyco-route-test/${{ matrix.asset }}" > "$RUNNER_TEMP/lyco-route-test/mihomo"
          chmod +x "$RUNNER_TEMP/lyco-route-test/mihomo"
          echo "LYCO_MIHOMO_PATH=$RUNNER_TEMP/lyco-route-test/mihomo" >> "$GITHUB_ENV"
      - name: Prepare pinned Windows compatible Mihomo
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir="$env:RUNNER_TEMP\lyco-route-test"
          New-Item -Force -ItemType Directory $dir | Out-Null
          gh release download v1.19.32 -R MetaCubeX/mihomo -p '${{ matrix.asset }}' -D $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "$dir\${{ matrix.asset }}" -DestinationPath "$dir\unpacked"
          $binary=Get-ChildItem "$dir\unpacked" -Recurse -File -Filter '*.exe' | Where-Object {$_.Name -match '^mihomo'} | Select-Object -First 1
          if (-not $binary) { throw 'Official Mihomo executable missing' }
          Copy-Item -LiteralPath $binary.FullName -Destination "$dir\mihomo.exe"
          "LYCO_MIHOMO_PATH=$dir\mihomo.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Observe real per-workspace authenticated upstreams and stopped-route behavior
        run: node tests/workspace-routes-integration.mjs
      - name: Retain route observations without subscription credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-workspace-routes-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-workspace-route-evidence
          if-no-files-found: warn
          retention-days: 7
  desktop:
    needs: workspace-routes
    if: ${{ inputs.routes_only != true && inputs.font_inventory_only != true && (inputs.speed_probe == '' || inputs.speed_probe == 'none') }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64, runner: macos-26, mihomo: mihomo-darwin-arm64-v1.19.32.gz, arch: arm64 }
          - { target: linux-x64, runner: ubuntu-22.04, mihomo: mihomo-linux-amd64-v1.19.32.gz, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      LYCO_DESKTOP_PUBLIC_RELEASE: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
      OPENBROWSER_PACKAGE_ARCH: ${{ matrix.arch }}
    steps:
      - name: Checkout LYCO integration
        uses: actions/checkout@v4
        with:
          path: lyco

      - name: Checkout pinned OpenBrowser source and target kernel
        uses: actions/checkout@v4
        with:
          repository: sheying2013/OpenBrowser
          ref: 5fa3b9d0bd218a948da15820b35fe598c362eba0
          path: upstream
          lfs: true
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/windows-x64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/Browserapp/package-lock.json

      - name: Integrate official Billing VPN and verify JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node lyco/scripts/apply.js upstream/Browserapp
          for f in main.js preload.js renderer.js lyco/network.js lyco/ui.js lyco/workbench.js; do
            node --check "upstream/Browserapp/$f"
          done
          node --test lyco/tests/network.test.js lyco/tests/profiles.test.js lyco/tests/native-identity.test.js lyco/tests/startup-pages.test.js lyco/tests/third-party-notices.test.js
          node --test lyco/tests/ui-font.test.mjs
          node --test lyco/tests/workspace-routes.test.js
          node --test lyco/tests/update-policy.test.js lyco/tests/update-download.test.js lyco/tests/product-version.test.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build owner icon assets in Actions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install Pillow==11.3.0
          python lyco/scripts/build-icons.py

      - name: Install upstream dependencies
        shell: bash
        working-directory: upstream/Browserapp
        run: npm ci --include=dev

      - name: Install Linux desktop dependencies (Linux only)
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y unzip xvfb libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcups2 libdrm2 libgbm1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libxcomposite1 libxdamage1 libxfixes3 libxkbcommon0 libxrandr2

      - name: Fetch official pinned Mihomo core (no opaque third-party binary)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upstream/Browserapp/lyco/core
          gh release download v1.19.32 -R MetaCubeX/mihomo -p '${{ matrix.mihomo }}' -D "$RUNNER_TEMP"
          gzip -dc "$RUNNER_TEMP/${{ matrix.mihomo }}" > upstream/Browserapp/lyco/core/mihomo
          chmod +x upstream/Browserapp/lyco/core/mihomo
          test -f upstream/Browserapp/lyco/core/LICENSE-MIHOMO.txt

      - name: Prepare browser kernel (Linux)
        if: matrix.target == 'linux-x64'
        working-directory: upstream/Browserapp
        shell: bash
        run: |
          set -euo pipefail
          npm run prepare:linux-kernel
          OPENBROWSER_VERIFY_PLATFORM=linux-x64 npm run prepare:bundled-kernel

      - name: Prepare browser kernel (macOS ARM64)
        if: matrix.target == 'macos-arm64'
        working-directory: upstream/Browserapp
        shell: bash
        run: |
          set -euo pipefail
          test -f kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern
          chmod +x kernels/macos-arm64/Wayfern.app/Contents/MacOS/Wayfern || true
          npm run prepare:bundled-kernel

      - name: Upstream isolation and network regression
        working-directory: upstream/Browserapp
        shell: bash
        run: |
          set -euo pipefail
          npm run selftest
          npm run selftest:isolation
          npm run selftest:proxyconcurrency
          node --test ../../lyco/tests/upstream-start-failure.test.js ../../lyco/tests/upstream-update-download.test.js ../../lyco/tests/upstream-product-version.test.js

      - name: Package desktop application in runner only
        working-directory: upstream/Browserapp
        shell: bash
        run: |
          set -euo pipefail
          npm run package:portable

      - name: Verify macOS DMG
        if: matrix.target == 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/Browserapp/dist/OpenBrowser-macOS-arm64-with-kernel.dmg
          test -f upstream/Browserapp/dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app/Contents/Resources/app/lyco/core/mihomo
          cp upstream/Browserapp/dist/OpenBrowser-macOS-arm64-with-kernel.dmg upstream/Browserapp/dist/LYCO-Browser-macOS-arm64-MVP.dmg

      - name: Verify Linux tar.gz
        if: matrix.target == 'linux-x64'
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/Browserapp/dist/OpenBrowser-Linux-x86_64-with-kernel.tar.gz
          test -f upstream/Browserapp/dist/OpenBrowser-Linux-x86_64-with-kernel/runtime/resources/app/lyco/core/mihomo
          cp upstream/Browserapp/dist/OpenBrowser-Linux-x86_64-with-kernel.tar.gz upstream/Browserapp/dist/LYCO-Browser-Linux-x64-MVP.tar.gz

      - name: Install the native packaged acceptance driver
        shell: bash
        run: npm install --prefix lyco --no-save --package-lock=false --ignore-scripts playwright@1.55.0

      - name: Real packaged macOS environment and proxy acceptance
        if: matrix.target == 'macos-arm64'
        shell: bash
        env:
          LYCO_UNIX_EVIDENCE: ${{ runner.temp }}/lyco-unix-macos
        run: |
          node lyco/tests/native-unix-workspaces.mjs upstream/Browserapp/dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app/Contents/MacOS/OpenBrowser upstream/Browserapp/dist/OpenBrowser-macOS-arm64-with-kernel/OpenBrowser.app/Contents/Resources/app

      - name: Real packaged Linux environment and proxy acceptance
        if: matrix.target == 'linux-x64'
        shell: bash
        env:
          LYCO_UNIX_EVIDENCE: ${{ runner.temp }}/lyco-unix-linux
        run: |
          xvfb-run -a node lyco/tests/native-unix-workspaces.mjs upstream/Browserapp/dist/OpenBrowser-Linux-x86_64-with-kernel/runtime/OpenBrowser upstream/Browserapp/dist/OpenBrowser-Linux-x86_64-with-kernel/runtime/resources/app

      - name: Retain original Unix native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-unix-native-${{ matrix.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lyco-unix-*/report.json
            ${{ runner.temp }}/lyco-unix-*/workbench.png
            ${{ runner.temp }}/lyco-unix-*/account-proxy_*.png
            ${{ runner.temp }}/lyco-unix-*/ui-cjk-workbench.png
            ${{ runner.temp }}/lyco-unix-*/workspace-*.png
          retention-days: 7

      - name: Upload macOS DMG to GitHub prerelease
        if: matrix.target == 'macos-arm64' && github.event_name != 'pull_request'
        shell: bash
        run: bash lyco/scripts/ci-publish-release.sh upstream/Browserapp/dist/LYCO-Browser-macOS-arm64-MVP.dmg

      - name: Upload Linux portable tar.gz to GitHub prerelease
        if: matrix.target == 'linux-x64' && github.event_name != 'pull_request'
        shell: bash
        run: bash lyco/scripts/ci-publish-release.sh upstream/Browserapp/dist/LYCO-Browser-Linux-x64-MVP.tar.gz

  packaged-font-inventory:
    if: ${{ inputs.font_inventory_only == true && (inputs.speed_probe == '' || inputs.speed_probe == 'none') }}
    name: Retained desktop fonts · original metadata only
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # GitHub exposes draft assets only to push-capable credentials. This
      # isolated job only downloads the pinned private candidate; no publishing.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install isolated pinned metadata decoders
        run: |
          python3 -m venv "$RUNNER_TEMP/font-audit-tools"
          "$RUNNER_TEMP/font-audit-tools/bin/pip" install fonttools==4.60.1 Brotli==1.1.0
      - name: Read only the retained candidate with its exact reviewed digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/font-audit-input"
          gh release download ci-e5ed18067c7a -R "$GITHUB_REPOSITORY" -p LYCO-Browser-Linux-x64-MVP.tar.gz -D "$RUNNER_TEMP/font-audit-input"
      - name: Decode original font metadata without repository credentials
        run: |
          "$RUNNER_TEMP/font-audit-tools/bin/python" scripts/audit-packaged-fonts.py "$RUNNER_TEMP/font-audit-input/LYCO-Browser-Linux-x64-MVP.tar.gz" "$RUNNER_TEMP/font-audit-evidence"
      - name: Retain original copyright and license fields with file hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-packaged-font-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/font-audit-evidence
          if-no-files-found: warn
          retention-days: 7

  speed-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.speed_probe != 'none'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Generate one-use probe identity
        run: |
          umask 077
          ssh-keygen -q -t ed25519 -N '' -C lyco-speed-${{ github.run_id }} -f "$RUNNER_TEMP/probe-key"
          printf '%s\n' '8.153.102.122 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFdaqiP/PZx1RyCI/pfrLGgpJwX/EXRSFaWvVs3xrfsd' > "$RUNNER_TEMP/probe-hosts"
      - uses: actions/upload-artifact@v4
        with:
          name: proxy-speed-public-key-${{ github.run_id }}
          path: ${{ runner.temp }}/probe-key.pub
          retention-days: 1
      - name: Await narrowly scoped temporary authorization
        run: |
          for attempt in $(seq 1 60); do
            if ssh -i "$RUNNER_TEMP/probe-key" -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/probe-hosts" root@8.153.102.122 '${{ inputs.speed_probe }}' > "$RUNNER_TEMP/proxy-speed-result.json" 2> "$RUNNER_TEMP/proxy-speed-ssh.log"; then
              cat "$RUNNER_TEMP/proxy-speed-result.json"
              python3 -c 'import json,hashlib,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"proxy-speed-result.json").read_text()); assert d["probeSourceSha256"]==hashlib.sha256(pathlib.Path("tests/ops/proxy_speed_probe.py").read_bytes()).hexdigest()'
              exit 0
            fi
            if test -s "$RUNNER_TEMP/proxy-speed-result.json"; then
              cat "$RUNNER_TEMP/proxy-speed-result.json"
              exit 1
            fi
            sleep 4
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proxy-speed-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/proxy-speed-result.json
            ${{ runner.temp }}/proxy-speed-ssh.log
          retention-days: 7
      - name: Remove private one-use identity
        if: always()
        run: rm -f "$RUNNER_TEMP/probe-key"
