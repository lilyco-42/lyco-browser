name: LYCO browser extension gates
on:
  pull_request:
    paths: ['extensions/**', 'scripts/package-extension.py', 'resources/branding/**', '.github/workflows/extension.yml']
  push:
    branches: [main]
    paths: ['extensions/**', 'scripts/package-extension.py', 'resources/branding/**', '.github/workflows/extension.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Unit guards and background routing lifecycle
        run: node --test extensions/lain42/tests/*.test.mjs
      - name: Package original Lyco icons and exact extension source
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/package-extension.py
      - name: Install acceptance browser only in Actions
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Actual Chromium extension and proxy lifecycle
        run: xvfb-run -a node extensions/lain42/tests/browser.mjs
      - name: Retain acceptance screenshots in an unpublished draft
        if: always() && github.actor == github.repository_owner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d extension-evidence ]; then
            python -m zipfile -c "$RUNNER_TEMP/extension-evidence.zip" extension-evidence
            tag="extension-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            gh release create "$tag" --target "$GITHUB_SHA" --draft --title "Extension acceptance $GITHUB_RUN_ID"
            gh release upload "$tag" "$RUNNER_TEMP/extension-evidence.zip"
          fi
      - name: Publish only the accepted main-commit extension
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="extension-${GITHUB_SHA:0:12}"
          gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title "LYCO subscription extension ${GITHUB_SHA:0:12}" --notes "Actions-tested unpacked Chrome/Edge extension. Import the loopback connection code from the desktop client. No account tokens or payment credentials are stored by the extension."
          gh release upload "$tag" dist/LYCO-Subscription-Extension.zip dist/LYCO-Subscription-Extension.zip.sha256
