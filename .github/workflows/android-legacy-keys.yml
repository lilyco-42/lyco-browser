name: Actual Android legacy website key preservation (not engine migration)
on:
  pull_request:
    branches: [main]
    paths: ['tests/mobile/legacy-keys/**', '.github/workflows/android-legacy-keys.yml']
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Existing successful unchanged owner-signed Android run; no new product build'
        required: true
        type: string
        default: '41964719754'
permissions:
  contents: read
  actions: read
concurrency:
  group: android-legacy-keys-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  syntax:
    name: Parse and derive owned-key fixture only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Parse new sources and generate the exact isolated fixture in Actions
        run: |
          python3 -m py_compile tests/mobile/legacy-keys/prepare.py tests/mobile/legacy-keys/assert-keys.py
          node --check tests/mobile/legacy-keys/owned-key.js
          python3 tests/mobile/legacy-keys/prepare.py
          node --check "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/workspace-routing-fixture.mjs"
          node --check "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/fixture.mjs"
          bash -n "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/run-paid.sh"
          python3 -m py_compile "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/download-legacy.py"
      - name: Preserve actual preparation inputs and exact replacements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-legacy-key-preflight-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-legacy-key-preparation
          if-no-files-found: error
          retention-days: 7
  android-legacy-fixture:
    needs: syntax
    if: github.event_name == 'workflow_dispatch'
    name: Prepare exact historical Android compatibility fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Draft downloads require push access (GitHub releases API). Limit that
    # permission to this fixed-hash download job; no builds or device tools run.
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - name: Recover only the exact original signed historical files
        run: |
          python3 tests/mobile/legacy-keys/prepare.py
          python3 "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/download-legacy.py"
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-legacy-fixture-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-paid-legacy
          if-no-files-found: error
          retention-days: 7

  android-paid-routes:
    needs: android-legacy-fixture
    if: github.event_name == 'workflow_dispatch'
    name: Actual old/current Android key preservation and original paid acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      GH_TOKEN: ${{ github.token }}
      LYCO_PAID_CANDIDATE_RUN: ${{ inputs.candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Prepare isolated key evidence with unchanged original paid gates
        run: python3 tests/mobile/legacy-keys/prepare.py
      - name: Download only a successful signed candidate with unchanged runtime sources
        run: |
          set -euo pipefail
          [[ "$LYCO_PAID_CANDIDATE_RUN" =~ ^[0-9]{5,20}$ ]]
          gh run watch "$LYCO_PAID_CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LYCO_PAID_CANDIDATE_RUN" > "$RUNNER_TEMP/lyco-paid-source-run.json"
          candidate_sha=$(python3 -c 'import json,sys;x=json.load(open(sys.argv[1]));assert x["conclusion"]=="success";print(x["head_sha"])' "$RUNNER_TEMP/lyco-paid-source-run.json")
          git fetch --no-tags origin "$candidate_sha"
          git diff --exit-code "$candidate_sha" HEAD -- apps/universal mobile/core src/product-version.js
          mkdir -p "$RUNNER_TEMP/lyco-paid-candidate" "$RUNNER_TEMP/lyco-paid-legacy" "$RUNNER_TEMP/lyco-mobile-paid"
          gh run download "$LYCO_PAID_CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" -n "lyco-android-candidate-$LYCO_PAID_CANDIDATE_RUN" -D "$RUNNER_TEMP/lyco-paid-candidate"
          python3 "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/download-legacy.py" --from-current-run
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for label in candidate legacy; do
            directory="$RUNNER_TEMP/lyco-paid-$label"
            (cd "$directory" && sha256sum -c ANDROID-SHA256SUMS.txt)
            "$signer" verify --verbose --print-certs "$directory/LYCO-Browser-Android-preview.apk" > "$RUNNER_TEMP/lyco-mobile-paid/$label-signature.txt"
            LYCO_REQUIRE_RELEASE_SIGNATURE=true python3 apps/universal/scripts/verify-android-signature.py "$RUNNER_TEMP/lyco-mobile-paid/$label-signature.txt" resources/signing/android-release-certificate.pem
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);candidate=root/'lyco-paid-candidate/LYCO-Browser-Android-preview.apk'
          run=json.loads((root/'lyco-paid-source-run.json').read_text())
          provenance=json.loads((root/'lyco-paid-candidate/ANDROID-VERSION-PROVENANCE.json').read_text())
          assert provenance['commit']==run['head_sha'] and provenance['run']==str(run['id'])
          with candidate.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          (root/'lyco-mobile-paid/candidate.json').write_text(json.dumps({'run':run['id'],'source':run['head_sha'],'sha256':digest,'runtime_source_diff':'empty','signed_certificate':'retained-owner-certificate','apk_modified':False},indent=2))
          PY
          echo "LYCO_CANDIDATE_APK=$RUNNER_TEMP/lyco-paid-candidate/LYCO-Browser-Android-preview.apk" >> "$GITHUB_ENV"
          echo "LYCO_LEGACY_APK=$RUNNER_TEMP/lyco-paid-legacy/LYCO-Browser-Android-preview.apk" >> "$GITHUB_ENV"
      - name: Install isolated CI device network tools and pinned UI driver
        run: |
          python3 -m venv "$RUNNER_TEMP/lyco-paid-mitm"
          "$RUNNER_TEMP/lyco-paid-mitm/bin/pip" install mitmproxy==12.2.1
          bash tests/mobile/install-maestro.sh
      - name: Enable KVM for disposable native device acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify default TLS, actual old-APK upgrade, persisted nodes, negative routing and native revocation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -writable-system
          script: bash "$RUNNER_TEMP/lyco-legacy-key-overlay/tests/mobile/paid/run-paid.sh"
      - name: Retain actual paid-routing observations without private CA or storage databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-paid-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-paid
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain exact original and generated fixture sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-legacy-key-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-legacy-key-preparation
          if-no-files-found: error
          retention-days: 7
      - name: Clean private disposable certificate and storage copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/lyco-paid-private-ca" "$RUNNER_TEMP/lyco-paid-private-storage"
