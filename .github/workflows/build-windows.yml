name: Build LYCO Browser (Windows x64, GitHub Actions ONLY)

on:
  push:
    branches: [main]
    paths: ['src/**', 'native/**', 'scripts/**', 'tests/**', 'resources/**', '.github/workflows/build-windows.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'native/**', 'scripts/**', 'tests/**', 'resources/**', '.github/workflows/build-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integration-guards:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reject session and ownership regressions before downloading the browser kernel
        run: node --test tests/public-network-result.test.mjs tests/desktop-appearance.test.js tests/network.test.js tests/profiles.test.js tests/native-identity.test.js tests/native-navigator.test.js tests/rect-geometry.test.js tests/startup-pages.test.js tests/session-restore.test.js tests/new-tab-gate.test.js tests/canvas-ownership-contract.test.mjs tests/independent-fingerprint-audits.test.mjs tests/release-publishing.test.js tests/core-startup-observer.test.js tests/source-patch.test.js tests/browser-target-observer.test.js tests/connect-handler.test.mjs tests/audit-cpu-diagnostic.test.mjs tests/audit-page-lifecycle.test.mjs tests/native-font-observation.test.mjs tests/browser-font-control.test.mjs

      - name: Diagnostic UI syntax and exact environment routing guards
        run: |
          node --check src/diagnostics-ui.js
          node --test tests/diagnostics-controller.test.js
          node --test tests/release-preview.test.js
          node --test tests/browser-webgl-identity.test.mjs
          node --test tests/browser-privacy-surfaces.test.mjs

  windows-x64:
    needs: integration-guards
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      OPENBROWSER_PACKAGE_ARCH: x86_64
      OPENBROWSER_PACKAGE_VARIANT: with-kernel
      OPENBROWSER_BUNDLE_KERNEL: 'true'
      LYCO_DESKTOP_PUBLIC_RELEASE: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Enable long paths before checkout
        shell: pwsh
        run: |
          git config --global core.longpaths true
          try { New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force | Out-Null } catch { Write-Host "Registry update skipped" }

      - name: Checkout LYCO integration
        uses: actions/checkout@v4
        with:
          path: lyco
          persist-credentials: false

      - name: Checkout PINNED OpenBrowser Windows browser source
        uses: actions/checkout@v4
        with:
          repository: sheying2013/OpenBrowser
          ref: 5fa3b9d0bd218a948da15820b35fe598c362eba0
          path: upstream
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: upstream/Browserapp/package-lock.json

      # Audit sources stay outside Browserapp and never enter sold packages.
      - name: Checkout fixed CreepJS audit source
        uses: actions/checkout@v4
        with:
          repository: abrahamjuliot/creepjs
          ref: 10aa6724cd33a1015db1574211890518cd04f0cc
          path: fingerprint-audits/creepjs
          persist-credentials: false

      - name: Checkout fixed community locale audit source
        uses: actions/checkout@v4
        with:
          repository: gokuscraper/claude-tester
          ref: 58a93a7b0304e40723c42f7fbe18035c1f353fdd
          path: fingerprint-audits/claude-tester
          persist-credentials: false

      - name: Checkout fixed FingerprintJS audit source
        uses: actions/checkout@v4
        with:
          repository: fingerprintjs/fingerprintjs
          ref: d43c48aeffd66165e102036af79e956b1fbbf4e1
          path: fingerprint-audits/fingerprintjs
          persist-credentials: false

      - name: Checkout fixed BotD audit source
        uses: actions/checkout@v4
        with:
          repository: fingerprintjs/BotD
          ref: 66da86e9d9e7206e817a0f7fdbdfa8fe37f3cd47
          path: fingerprint-audits/botd
          persist-credentials: false

      - name: Prepare independent audit assets (not browser acceptance)
        shell: pwsh
        env:
          GH_TOKEN: ''
        run: |
          npm ci --prefix fingerprint-audits/claude-tester --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit 1 }
          npm run build --prefix fingerprint-audits/claude-tester -- --base=/independent/locale/
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # These upstreams commit Yarn v1 locks; preserve their dependency graph
          # and use Git Bash for their POSIX-quoted Rollup build commands.
          $env:npm_config_script_shell="$env:ProgramFiles\Git\bin\bash.exe"
          foreach ($sdk in @('fingerprintjs','botd')) {
            npx --yes yarn@1.22.22 --cwd "fingerprint-audits/$sdk" install --frozen-lockfile --ignore-scripts --ignore-engines --non-interactive
            if ($LASTEXITCODE -ne 0) { exit 1 }
            npm run build --prefix "fingerprint-audits/$sdk"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          foreach ($file in @('fingerprint-audits/creepjs/docs/index.html', 'fingerprint-audits/creepjs/docs/creep.js', 'fingerprint-audits/claude-tester/dist/index.html', 'fingerprint-audits/fingerprintjs/dist/fp.esm.js', 'fingerprint-audits/botd/dist/botd.esm.js')) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing audit asset: $file" }
            Get-FileHash -LiteralPath $file -Algorithm SHA256 | Format-List
          }
          Write-Host 'Sources prepared only. No external fingerprint detector has passed yet.'

      - name: Apply LYCO patch and static syntax checks
        shell: pwsh
        run: |
          node lyco/scripts/apply.js upstream/Browserapp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          foreach ($path in @('upstream/Browserapp/main.js','upstream/Browserapp/preload.js','upstream/Browserapp/renderer.js','upstream/Browserapp/lyco/ui.js','upstream/Browserapp/lyco/network.js','upstream/Browserapp/lyco/workbench.js','upstream/Browserapp/automation/user-agent.js','upstream/Browserapp/automation/fingerprint.js')) {
            node --check $path
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Checkout pinned UniDesktop SDK (read-only appearance backend)
        uses: actions/checkout@v4
        with:
          repository: UniDesktop/SDK
          ref: a74bd2cf372efad2407d6be4b57739e682cf1d9a
          path: unidesktop
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.90.0

      - name: Build and verify the bounded UDA desktop helper
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ''
        run: |
          $ErrorActionPreference='Stop'
          $lockHash=(Get-FileHash unidesktop/Cargo.lock -Algorithm SHA256).Hash
          Copy-Item lyco/native/desktop-probe.rs unidesktop/crates/uda-platform-windows/src/lyco-desktop-probe.rs
          Add-Content -LiteralPath unidesktop/crates/uda-platform-windows/Cargo.toml -Value "`n[[bin]]`nname = 'lyco-desktop-probe'`npath = 'src/lyco-desktop-probe.rs'"
          cargo build --locked --release --manifest-path unidesktop/Cargo.toml -p uda-platform-windows --bin lyco-desktop-probe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo test --locked --manifest-path unidesktop/Cargo.toml -p uda-platform-windows --lib appearance::tests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ((Get-FileHash unidesktop/Cargo.lock -Algorithm SHA256).Hash -ne $lockHash) { throw 'SDK dependency lock changed' }
          $dest='upstream/Browserapp/lyco/desktop'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item unidesktop/target/release/lyco-desktop-probe.exe "$dest/lyco-desktop-probe.exe"
          Copy-Item unidesktop/LICENSE-MIT "$dest/LICENSE-MIT-UDA.txt"
          Copy-Item unidesktop/LICENSE-APACHE "$dest/LICENSE-APACHE-UDA.txt"
          Copy-Item lyco/native/NOTICE.txt "$dest/NOTICE.txt"
          $binaryHash=(Get-FileHash "$dest/lyco-desktop-probe.exe" -Algorithm SHA256).Hash
          "LYCO_UDA_BINARY_SHA256=$binaryHash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify actual UDA reads against disposable Windows settings
        shell: pwsh
        run: ./lyco/tests/desktop-probe.ps1

      - name: Isolated LYCO proxy and Billing integration tests
        shell: pwsh
        run: |
          node --test lyco/tests/network.test.js lyco/tests/profiles.test.js lyco/tests/native-identity.test.js lyco/tests/startup-pages.test.js lyco/tests/session-restore.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build owner icon assets in Actions
        shell: pwsh
        run: |
          python -m pip install Pillow==11.3.0
          python lyco/scripts/build-icons.py
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install distinctly named host font positive control in disposable runner
        timeout-minutes: 4
        shell: pwsh
        run: ./lyco/tests/install-host-font-control.ps1

      - name: Install upstream dependencies
        shell: pwsh
        working-directory: upstream/Browserapp
        run: npm ci --include=dev

      - name: Upstream fingerprint browser isolation regression
        shell: pwsh
        working-directory: upstream/Browserapp
        run: |
          foreach($suite in @('selftest','selftest:isolation','selftest:proxyconcurrency','selftest:profiles')) {
            npm run $suite
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          node --test ../../lyco/tests/upstream-start-failure.test.js ../../lyco/tests/upstream-native-layout.test.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Download pinned official Mihomo for LYCO local proxy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $version='v1.19.32'
          $filename="mihomo-windows-amd64-compatible-$version.zip"
          $dir="$env:RUNNER_TEMP\lyco-mihomo"
          New-Item -Force -ItemType Directory $dir | Out-Null
          gh release download $version -R MetaCubeX/mihomo -p $filename -D $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Expand-Archive "$dir\$filename" -DestinationPath "$dir\unpacked"
          $binary=Get-ChildItem "$dir\unpacked" -Recurse -File -Filter "*.exe" |
            Where-Object { $_.Name -match '^mihomo' } | Select-Object -First 1
          if (-not $binary) { throw "Mihomo executable missing from official release" }
          $dest='upstream/Browserapp/lyco/core'
          New-Item -Force -ItemType Directory $dest | Out-Null
          Copy-Item -LiteralPath $binary.FullName -Destination "$dest/mihomo.exe"

      - name: Install packaging tool NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes

      - name: Prepare integrated browser kernel
        shell: pwsh
        working-directory: upstream/Browserapp
        run: |
          foreach($file in @('kernels/windows-x64/chrome.exe','kernels/windows-x64/chrome.dll')){
            if (-not (Test-Path $file)) { throw "Pinned Windows browser kernel missing: $file" }
          }
          npm run prepare:bundled-kernel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Native preflight before expensive archive and installer compression
        # Retain sequential A/B and new-target checks, then seed and restore a
        # genuine two-tab session. Allow those two extra native launches while
        # keeping each individual operation and the whole step bounded.
        timeout-minutes: 18
        shell: pwsh
        env:
          LYCO_INDEPENDENT_AUDITS: 'true'
        run: |
          npm install --prefix lyco --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node -e "const p=require('path');require('./upstream/Browserapp/scripts/ensure-host-runtime').ensureHostRuntime(p.resolve('upstream/Browserapp'))"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node upstream/Browserapp/scripts/build-native.js upstream/Browserapp
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $binary=node -e "const p=require('path');const r=require('./upstream/Browserapp/scripts/resolve-host-dist');console.log(r.findHostWindowsExe(r.resolveHostDist(p.resolve('upstream/Browserapp'))))"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node lyco/tests/native-workspaces.mjs $binary upstream/Browserapp lyco-native-preflight
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Preserve preflight evidence before archive compression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-preflight-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: lyco-native-preflight/

      - name: Build Windows portable ZIP and installer
        shell: pwsh
        working-directory: upstream/Browserapp
        run: |
          npm run package:portable
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $stem='OpenBrowser-Windows-x86_64-with-kernel'
          $app="dist/$stem/runtime/resources/app"
          foreach($file in @("$app/lyco/network.js","$app/lyco/ui.js","$app/lyco/core/mihomo.exe","$app/lyco/core/LICENSE-MIHOMO.txt","$app/kernels/windows-x64/chrome.exe")){
            if (-not (Test-Path $file)) { throw "Package missing: $file" }
          }
          foreach($ext in @('zip','exe')){
            if (-not (Test-Path "dist/$stem.$ext")) { throw "Missing artifact $ext" }
            Copy-Item "dist/$stem.$ext" "dist/LYCO-Browser-Windows-x64-MVP.$ext"
          }

      - name: Native packaged membership, owned profiles and real proxy routing
        timeout-minutes: 18
        shell: pwsh
        env:
          LYCO_INDEPENDENT_AUDITS: 'true'
        run: |
          npm install --prefix lyco --no-save --package-lock=false --ignore-scripts playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $root='upstream/Browserapp/dist/OpenBrowser-Windows-x86_64-with-kernel'
          node lyco/tests/native-workspaces.mjs "$root/runtime/OpenBrowser.exe" "$root/runtime/resources/app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install the actual EXE, verify LYCO icons and shortcuts, run it and uninstall
        timeout-minutes: 12
        shell: pwsh
        run: ./lyco/tests/windows-installer.ps1

      - name: Observe Net.Coffee in an actual LYCO profile on the public CI route
        timeout-minutes: 6
        shell: pwsh
        run: |
          $root='upstream/Browserapp/dist/OpenBrowser-Windows-x86_64-with-kernel'
          node lyco/tests/native-public-network.mjs "$root/runtime/OpenBrowser.exe" "$root/runtime/resources/app"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Preserve native diagnostics even when a PR cannot create releases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            lyco-native-preflight/
            lyco-native-evidence/
            lyco-native-installed/
            lyco-public-network/

      - name: Remove the job-owned font control
        if: always()
        timeout-minutes: 1
        shell: pwsh
        run: ./lyco/tests/install-host-font-control.ps1 -Action Remove

      - name: Preserve native acceptance evidence in an unpublished draft
        if: always() && github.event_name != 'pull_request' && github.repository == 'lilyco-42/lyco-browser' && github.actor == github.repository_owner
        shell: pwsh
        run: |
          $directories=@('lyco-native-preflight','lyco-native-evidence','lyco-native-installed') | Where-Object {Test-Path $_}
          if ($directories) {
            Compress-Archive -Path $directories -DestinationPath "$env:RUNNER_TEMP/lyco-native-evidence.zip"
            $tag="evidence-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --draft --title "CI evidence $env:GITHUB_RUN_ID"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            gh release upload $tag "$env:RUNNER_TEMP/lyco-native-evidence.zip" --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Retain a gate-validated owner PR package in an unpublished draft
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == github.repository_owner
        timeout-minutes: 10
        shell: bash
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          LYCO_NATIVE_GATES_PASSED: 'true'
        run: |
          bash lyco/scripts/ci-retain-windows-preview.sh \
            upstream/Browserapp/dist/LYCO-Browser-Windows-x64-MVP.zip \
            upstream/Browserapp/dist/LYCO-Browser-Windows-x64-MVP.exe

      - name: Upload Windows portable ZIP and EXE to GitHub prerelease
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          bash lyco/scripts/ci-publish-release.sh \
            upstream/Browserapp/dist/LYCO-Browser-Windows-x64-MVP.zip \
            upstream/Browserapp/dist/LYCO-Browser-Windows-x64-MVP.exe
