name: Investigate pinned Windows native SDK ordering (not release acceptance)
on:
  pull_request:
    branches: [main]
    paths: ['tests/native-sdk-order-probe.mjs', '.github/workflows/probe-windows-native-sdk.yml']
  workflow_dispatch:
    inputs:
      metadata_only:
        description: Inspect the official public kernel feed without downloading or running another browser
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  current-public-metadata:
    if: inputs.metadata_only
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read official public version metadata without credentials
        run: |
          python3 - <<'PY'
          import json,os,re,urllib.request,urllib.error
          from pathlib import Path
          from urllib.parse import urlsplit
          result={'source':'https://donutbrowser.com/wayfern.json','scope':'Public metadata only; no binary, license token, or product acceptance'}
          try:
              with urllib.request.urlopen(result['source'],timeout=30) as response:
                  raw=response.read(2*1024*1024+1)
                  result['http_status']=response.status
              if len(raw)>2*1024*1024:raise ValueError('metadata too large')
              data=json.loads(raw)
              version=data.get('version','')
              if not isinstance(version,str) or not re.fullmatch(r'[0-9]+(?:\.[0-9]+){0,3}',version):raise ValueError('invalid version')
              result['version']=version;result['downloads']={}
              for platform in ['windows-x86_64','windows-x64','linux-x86_64','linux-x64','macos-aarch64','macos-arm64','macos-x86_64','macos-x64']:
                  value=data.get('downloads',{}).get(platform)
                  if not isinstance(value,str):continue
                  url=urlsplit(value)
                  if url.scheme!='https' or url.hostname not in ['download.wayfern.com','donutbrowser.com'] or url.username or url.password or url.query or url.fragment:
                      result['downloads'][platform]={'available':True,'url_retained':False}
                  else:result['downloads'][platform]={'available':True,'url':value}
          except urllib.error.HTTPError as error:
              result['http_status']=error.code
          except Exception as error:
              result['error_type']=type(error).__name__
          target=Path(os.environ['RUNNER_TEMP'])/'official-wayfern-metadata.json'
          target.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-official-kernel-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/official-wayfern-metadata.json
          retention-days: 7
  native-sdk:
    if: ${{ !inputs.metadata_only }}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {path: lyco, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          repository: sheying2013/OpenBrowser
          ref: 5fa3b9d0bd218a948da15820b35fe598c362eba0
          path: upstream
          lfs: true
          persist-credentials: false
          sparse-checkout: |
            /*
            !/Browserapp/kernels/macos-x64/
            !/Browserapp/kernels/macos-arm64/
            !/Browserapp/kernels/openbrowser/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify product refusal and saved-identity preservation
        run: node --test lyco/tests/native-identity.test.js
      - name: Prepare pinned host modules
        working-directory: upstream/Browserapp
        run: npm ci --ignore-scripts
      - name: Measure native writes before and after protocol readiness
        timeout-minutes: 6
        run: node lyco/tests/native-sdk-order-probe.mjs upstream/Browserapp
      - name: Preserve bounded hardware observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-windows-sdk-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-sdk-order-probe
          if-no-files-found: warn
          retention-days: 7
