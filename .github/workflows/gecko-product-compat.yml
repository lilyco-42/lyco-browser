name: Gecko source and actual Expo product dependency compatibility
on:
  push:
    branches: ['ci/gecko-product-compat-*']
    paths: ['tests/mobile/engine/product-compat/**', '.github/workflows/gecko-product-compat.yml']
  pull_request:
    branches: [main]
    paths: ['tests/mobile/engine/product-compat/**', '.github/workflows/gecko-product-compat.yml']
  workflow_dispatch:
    inputs:
      inspect:
        description: 'Run unchanged product AAR metadata gate with validated source engine; retain any failure'
        type: boolean
        default: false
      toolchain:
        description: 'Current product or incremental SDK57 then SDK58 candidate in disposable copy only'
        type: choice
        options: [current, sdk58]
        default: current
      compile_platform:
        description: 'Generated SDK default or real Android37.2 in the SDK58 disposable candidate'
        type: choice
        options: [generated, '37.2']
        default: generated
      compile_product:
        description: 'Compile actual x86_64 product candidate after SDK58/API37.2 gates; no signing or engine adoption'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lyco-gecko-product-compat-v1-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Parse and retain exact compatibility source inputs
        run: |
          python3 -m py_compile tests/mobile/engine/product-compat/prepare.py
          python3 tests/mobile/engine/product-compat/prepare.py source
          bash -n tests/mobile/engine/download-source-engine.sh
      - name: Retain original source and preparation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-gecko-product-compat-source-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-gecko-product-compat/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  metadata:
    needs: preparation
    if: github.event_name == 'workflow_dispatch' && inputs.inspect
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/setup-go@v5
        if: inputs.compile_product
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Copy only tracked product source to disposable runner directory
        run: |
          python3 tests/mobile/engine/product-compat/prepare.py source
          python3 tests/mobile/engine/product-compat/prepare.py stage
      - name: Obtain exact previously validated source engine with unchanged verifier
        env:
          GH_TOKEN: ${{ github.token }}
          LYCO_SOURCE_ENGINE_RUN: '41940576338'
        run: bash tests/mobile/engine/download-source-engine.sh
      - name: Install exact original product lock
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal
        run: npm ci --no-audit --no-fund
      - name: Upgrade disposable copy to SDK57 and retain candidate lock
        if: inputs.toolchain == 'sdk58'
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal
        run: |
          npx expo install expo@57.0.0 --fix --npm
          npx expo install --check
          LYCO_TOOLCHAIN_STAGE=57 python3 "$GITHUB_WORKSPACE/tests/mobile/engine/product-compat/prepare.py" toolchain
      - name: Upgrade disposable copy to SDK58 and retain candidate lock
        if: inputs.toolchain == 'sdk58'
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal
        run: |
          npx expo install expo@58.0.0 --fix --npm
          npx expo install --check
          LYCO_TOOLCHAIN_STAGE=58 python3 "$GITHUB_WORKSPACE/tests/mobile/engine/product-compat/prepare.py" toolchain
      - name: Check unchanged product types and policy tests in candidate toolchain
        if: inputs.compile_product
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal
        run: |
          test '${{ inputs.toolchain }}' = sdk58
          test '${{ inputs.compile_platform }}' = 37.2
          npx tsc --noEmit
          node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs ../../tests/mobile-route-policy.test.mjs ../../tests/mobile-rtc-policy.test.mjs
          cd "$GITHUB_WORKSPACE/apps/universal"
          node scripts/verify-go-notices.mjs
      - name: Build actual unchanged Go binding sources for this candidate
        if: inputs.compile_product
        working-directory: mobile/core
        env:
          LYCO_CAPTURE_GENERATED_SOURCES: 'true'
        run: |
          bash build-native.sh android
          go test -tags with_quic,with_utls -count=1 ./...
          python3 "$LYCO_PRODUCT_COMPAT_ROOT/mobile/core/install-android.py"
          python3 bundle-source.py
      - name: Generate original product native project
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal
        run: npx expo prebuild --clean --platform android --non-interactive
      - name: Install real API37.2 platform for explicitly selected candidate
        if: inputs.compile_platform == '37.2'
        run: |
          test '${{ inputs.toolchain }}' = sdk58
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' -print -quit)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" --sdk_root="$ANDROID_HOME" 'platforms;android-37.2' \
            2>&1 | tee "$RUNNER_TEMP/lyco-gecko-product-compat/sdk-platform-install.log"
          cp "$ANDROID_HOME/platforms/android-37.2/source.properties" \
            "$RUNNER_TEMP/lyco-gecko-product-compat/sdk-platform-source.properties"
      - name: Add source dependency only in private module copy and retain actual toolchain
        run: python3 tests/mobile/engine/product-compat/prepare.py adapt
      - name: Check original product AAR metadata gates without suppression
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal/android
        run: |
          set +e
          chmod +x gradlew
          ./gradlew :app:checkReleaseAarMetadata --no-daemon --stacktrace --console=plain \
            --init-script "$GITHUB_WORKSPACE/tests/mobile/engine/product-compat/inspect.gradle" \
            2>&1 | tee "$RUNNER_TEMP/lyco-gecko-product-compat/gradle-metadata.log"
          actual_status=${PIPESTATUS[0]}
          echo "$actual_status" > "$RUNNER_TEMP/lyco-gecko-product-compat/gradle-exit-code.txt"
          exit "$actual_status"
      - name: Compile actual x86_64 product with source-built bindings and Gecko dependency
        if: inputs.compile_product
        working-directory: ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal/android
        run: |
          set +e
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace --console=plain \
            --init-script "$GITHUB_WORKSPACE/tests/mobile/engine/product-compat/inspect.gradle" \
            2>&1 | tee "$RUNNER_TEMP/lyco-gecko-product-compat/gradle-compile.log"
          actual_status=${PIPESTATUS[0]}
          echo "$actual_status" > "$RUNNER_TEMP/lyco-gecko-product-compat/compile-exit-code.txt"
          exit "$actual_status"
      - name: Preserve actual outcome without converting a failed gate into success
        if: always()
        run: python3 tests/mobile/engine/product-compat/prepare.py collect
      - name: Retain original configuration, complete task log and outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-gecko-product-compat-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-gecko-product-compat/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain actual native inputs, corresponding Go source and compiled candidate
        if: always() && inputs.compile_product
        uses: actions/upload-artifact@v4
        with:
          name: lyco-gecko-product-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lyco-tunnel.aar
            ${{ runner.temp }}/lyco-tunnel-bindings.txt
            ${{ runner.temp }}/lyco-mobile-core-source.tar.gz*
            ${{ runner.temp }}/lyco-generated-bindings-android.tar.gz*
            ${{ runner.temp }}/lyco-binding-capture-android/published/
            ${{ env.LYCO_PRODUCT_COMPAT_ROOT }}/apps/universal/android/app/build/outputs/apk/release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
