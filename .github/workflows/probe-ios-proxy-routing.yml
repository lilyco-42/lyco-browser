name: Investigate iOS public proxy routing (not release acceptance)
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/mobile/ios-proxy-probe.swift'
      - 'tests/mobile/run-ios-proxy-probe.sh'
      - 'tests/mobile/ios-probe-launch.py'
      - 'tests/mobile/proxy-probe-fixture.py'
      - 'tests/mobile/h2-relay-fixture.mjs'
      - '.github/workflows/probe-ios-proxy-routing.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-wkwebview:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25.5', cache-dependency-path: mobile/core/go.sum}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Parse bounded startup diagnostics on the real runner
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])
          evidence=Path(os.environ['RUNNER_TEMP'])/'lyco-ios-proxy-probe'
          records=[]
          for name in ['.github/workflows/probe-ios-proxy-routing.yml',
                       'tests/mobile/ios-probe-launch.py','tests/mobile/run-ios-proxy-probe.sh',
                       'tests/mobile/ios-proxy-probe.swift','tests/mobile/proxy-probe-fixture.py',
                       'tests/mobile/h2-relay-fixture.mjs']:
              raw=(root/name).read_bytes();target=evidence/'source'/name
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(raw)
              records.append({'path':name,'bytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest()})
          (evidence/'SOURCE.json').write_text(json.dumps({
              'run':os.environ['GITHUB_RUN_ID'],'source':os.environ['GITHUB_SHA'],'files':records,
              'coreTree':subprocess.check_output(['git','rev-parse','HEAD:mobile/core'],text=True).strip(),
              'scope':'Original probe and startup diagnostic source only; no runtime acceptance.'
          },indent=2)+'\n')
          PY
          python3 -m py_compile tests/mobile/ios-probe-launch.py
          bash -n tests/mobile/run-ios-proxy-probe.sh
      - name: Build the actual pinned Apple core for the isolated application
        working-directory: mobile/core
        run: bash build-native.sh apple
      - name: Compile, boot and install the isolated native application
        timeout-minutes: 12
        run: bash tests/mobile/run-ios-proxy-probe.sh prepare
      - name: Run the original routing gates and independent transport controls
        timeout-minutes: 7
        run: bash tests/mobile/run-ios-proxy-probe.sh run
      - name: Collect original simulator diagnostics after the investigation
        if: always()
        timeout-minutes: 1
        run: |
          evidence="$RUNNER_TEMP/lyco-ios-proxy-probe"
          if [[ -s "$evidence/simulator-udid.txt" ]]; then
            device=$(cat "$evidence/simulator-udid.txt")
            xcrun simctl io "$device" screenshot "$evidence/probe-screen.png" || true
            xcrun simctl spawn "$device" log show --style compact --last 5m --predicate 'process == "LYCOProxyProbe"' > "$evidence/probe-system.log" 2>&1 || true
          fi
      - name: Retain the original investigation observations even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-proxy-investigation-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-ios-proxy-probe
          if-no-files-found: warn
          retention-days: 7
