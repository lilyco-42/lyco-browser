name: React Native Universal · Android iOS Web (GitHub Actions only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/universal/**'
      - 'mobile/core/**'
      - '.github/workflows/build-universal.yml'
      - 'tests/mobile-*.mjs'
      - 'tests/mobile/**'
      - 'scripts/ci-publish-release.sh'
      - 'scripts/artifact-sha256.mjs'
      - 'src/product-version.js'
      - 'tests/product-version.test.js'
  pull_request:
    branches: [main]
    paths: ['apps/universal/**', 'mobile/core/**', 'tests/mobile-*.mjs', 'tests/mobile/**', 'scripts/ci-publish-release.sh', 'scripts/artifact-sha256.mjs', 'src/product-version.js', 'tests/product-version.test.js', '.github/workflows/build-universal.yml']
  workflow_dispatch:
    inputs:
      signed_android:
        description: 'Build a signed Android candidate in an owner-only draft (not a commercial release)'
        type: boolean
        default: false
      ios_device:
        description: 'Compile an unsigned iPhone device archive for signing and device review (not installable as-is)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/universal

jobs:
  web:
    if: ${{ !inputs.signed_android && !inputs.ios_device }}
    name: React Native Web / Windows macOS Linux shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Retain resolved dependency lock for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: lyco-universal-dependency-lock-${{ github.run_id }}
          path: apps/universal/package-lock.json
          retention-days: 7
      - run: node --test ../../tests/release-publishing.test.js ../../tests/third-party-notices.test.js ../../tests/product-version.test.js
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-web
      - name: Upload React Native Web to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$RUNNER_TEMP/LYCO-RN-Web.tar.gz" dist-web
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-RN-Web.tar.gz"

  android:
    if: ${{ !inputs.ios_device }}
    name: Android standalone preview / signed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      # Ubuntu GitHub-hosted runner already provides the Android SDK; avoid legacy 'tools' package.
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build and integrate the Android subscription core from source
        working-directory: mobile/core
        run: |
          bash build-native.sh android
          go test -tags with_quic,with_utls -count=1 ./...
          python3 install-android.py
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Prepare private signing key for an explicitly dispatched candidate
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import os, base64
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'lyco-release.p12'
          key=os.environ.get('ANDROID_KEYSTORE_BASE64','')
          if not key: raise SystemExit('Android signing key is not configured')
          target.write_bytes(base64.b64decode(key,validate=True))
          target.chmod(0o600)
          PYKEY
      - name: Compile a standalone Android preview without production secrets
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_android
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --stacktrace
      - name: Compile an explicitly dispatched signed Android candidate
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        env:
          LYCO_ANDROID_KEYSTORE: ${{ runner.temp }}/lyco-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --init-script ../scripts/android-signing.gradle --no-daemon --stacktrace
      - name: Verify Android signature and retain standalone preview
        env:
          LYCO_REQUIRE_RELEASE_SIGNATURE: ${{ inputs.signed_android }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk" | tee "$RUNNER_TEMP/ANDROID-SIGNATURE.txt"
          python3 scripts/verify-android-signature.py "$RUNNER_TEMP/ANDROID-SIGNATURE.txt" ../../resources/signing/android-release-certificate.pem
          cd "$RUNNER_TEMP"
          sha256sum LYCO-Browser-Android-preview.apk ANDROID-SIGNATURE-PROVENANCE.json > ANDROID-SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned mobile UI test driver
        run: bash ../../tests/mobile/install-maestro.sh
      - name: Enable KVM for native Android acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android A/B storage, reopen and real proxy acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tests/mobile/run-native.sh android
      - name: Retain original Android native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-android-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-android
          include-hidden-files: true
          retention-days: 7
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lyco-release.p12"
      - name: Retain Android candidate for owner review
        if: github.event_name == 'pull_request' || inputs.signed_android
        uses: actions/upload-artifact@v4
        with:
          name: lyco-android-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LYCO-Browser-Android-preview.apk
            ${{ runner.temp }}/ANDROID-SHA256SUMS.txt
            ${{ runner.temp }}/ANDROID-SIGNATURE.txt
            ${{ runner.temp }}/ANDROID-SIGNATURE-PROVENANCE.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android APK to GitHub prerelease
        if: github.event_name != 'pull_request' && !inputs.signed_android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk"

  ios-simulator:
    if: ${{ !inputs.signed_android && !inputs.ios_device }}
    name: iOS 26 simulator unsigned app · no signing
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - name: Display GitHub runner Xcode environment
        run: xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build and integrate the Apple subscription core from source
        working-directory: mobile/core
        run: |
          set -euo pipefail
          bash build-native.sh apple
          go test -tags with_quic,with_utls -count=1 ./...
          mkdir -p ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
          tar xzf "$RUNNER_TEMP/lyco-tunnel-apple.tar.gz" -C ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Compile standalone unsigned simulator app on Actions (not an IPA)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building application scheme: $SCHEME (not the first Pods workspace scheme)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LYCO_iOS" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned mobile UI test driver
        run: bash ../../tests/mobile/install-maestro.sh
      - name: Boot an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYSIM'
          import json,os
          from pathlib import Path
          devices=json.loads((Path(os.environ['RUNNER_TEMP'])/'simulators.json').read_text())['devices']
          phones=[x for group in devices.values() for x in group if x['name'].startswith('iPhone') and x.get('isAvailable')]
          if not phones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LYCO_IOS_SIMULATOR='+phones[0]['udid']+'\n')
          PYSIM
      - name: Native iOS A/B storage, reopen and real proxy acceptance
        run: |
          set -euo pipefail
          xcrun simctl boot "$LYCO_IOS_SIMULATOR" || xcrun simctl bootstatus "$LYCO_IOS_SIMULATOR" -b
          xcrun simctl bootstatus "$LYCO_IOS_SIMULATOR" -b
          export LYCO_IOS_APP=$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          bash ../../tests/mobile/run-native.sh ios
      - name: Retain original iOS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-ios-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-ios
          include-hidden-files: true
          retention-days: 7
      - name: Upload iOS simulator build to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"

      - name: Retain simulator preview for review only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/LYCO-Browser-iOS-simulator.zip
          retention-days: 7

  ios-device:
    if: github.event_name == 'workflow_dispatch' && inputs.ios_device && !inputs.signed_android
    name: iPhone ARM64 unsigned device archive · signing and runtime review required
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build Apple network core from pinned source
        working-directory: mobile/core
        run: |
          set -euo pipefail
          bash build-native.sh apple
          go test -tags with_quic,with_utls -count=1 ./...
          mkdir -p ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
          tar xzf "$RUNNER_TEMP/lyco-tunnel-apple.tar.gz" -C ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Compile iPhone device application without signing credentials
        run: |
          set -euo pipefail
          cd ios
          pod install
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/LYCO_Device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify device platform and package unsigned signing input
        run: bash ../../scripts/ci-package-ios-device.sh
      - name: Retain unsigned device archive and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-device-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LYCO-Browser-iOS-device-unsigned.ipa
            ${{ runner.temp }}/IOS-DEVICE-PROVENANCE.json
            ${{ runner.temp }}/IOS-DEVICE-SHA256SUMS.txt
            ${{ runner.temp }}/ios-device-platform.txt
          if-no-files-found: error
          retention-days: 7
