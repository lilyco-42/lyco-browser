name: React Native Universal · Android iOS Web (GitHub Actions only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/universal/**'
      - '.github/workflows/build-universal.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/universal

jobs:
  web:
    name: React Native Web / Windows macOS Linux shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-web
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-react-native-web-PROD
          path: apps/universal/dist-web
          if-no-files-found: error

  android:
    name: Android arm64/x64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Compile Android test APK on Actions
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-react-native-android-debug-apk
          path: apps/universal/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios-simulator:
    name: iOS 26 simulator unsigned app · no signing
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Display GitHub runner Xcode environment
        run: xcodebuild -version
      - run: npm install --no-audit --no-fund
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Compile unsigned simulator app on Actions (not an IPA)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(xcodebuild -list -json -workspace "$WORKSPACE" | python3 -c 'import json,sys;print(json.load(sys.stdin)["workspace"]["schemes"][0])')"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LYCO_iOS" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: lyco-react-native-ios-simulator-unsigned
          path: ${{ runner.temp }}/LYCO-Browser-iOS-simulator.zip
          if-no-files-found: error
