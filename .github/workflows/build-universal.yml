name: React Native Universal · Android iOS Web (GitHub Actions only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/universal/**'
      - 'mobile/core/**'
      - '.github/workflows/build-universal.yml'
      - 'tests/mobile-*.mjs'
      - 'tests/mobile/**'
      - 'scripts/ci-publish-release.sh'
      - 'scripts/artifact-sha256.mjs'
      - 'src/product-version.js'
      - 'tests/product-version.test.js'
  pull_request:
    branches: [main]
    paths: ['apps/universal/**', 'mobile/core/**', 'tests/mobile-*.mjs', 'tests/mobile/**', 'scripts/ci-publish-release.sh', 'scripts/artifact-sha256.mjs', 'src/product-version.js', 'tests/product-version.test.js', '.github/workflows/build-universal.yml']
  workflow_dispatch:
    inputs:
      signed_android:
        description: 'Build a signed Android internal candidate artifact (not a commercial release)'
        type: boolean
        default: false
      ios_device:
        description: 'Compile an unsigned iPhone device archive for signing and device review (not installable as-is)'
        type: boolean
        default: false
      paid_routes_candidate:
        description: 'Verify an already-built signed Android candidate run with CI Billing and actual saved node routing'
        type: string
        default: ''
      network_probe_candidate:
        description: Probe actual native RTC boundaries of an unchanged signed Android candidate with same-device direct controls
        type: string
        default: ''
      native_engine_probe:
        description: 'Standalone non-debuggable Gecko native policy capability experiment; no product engine change'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}-${{ inputs.native_engine_probe && 'engine-probe' || (inputs.network_probe_candidate && 'network-probe' || (inputs.paid_routes_candidate && 'paid-routes' || 'platform-build')) }}
  # Preserve the active native runtime evidence; newer pushes replace only the
  # pending run. A long iOS/Android acceptance must not be erased by a docs fix.
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/universal

jobs:
  web:
    if: ${{ !inputs.signed_android && !inputs.ios_device && !inputs.paid_routes_candidate && !inputs.network_probe_candidate && !inputs.native_engine_probe }}
    name: React Native Web / Windows macOS Linux shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Collect original installed JavaScript dependency notices
        run: node scripts/collect-npm-notices.mjs
      - name: Retain the exact offline notice bundle for this build
        uses: actions/upload-artifact@v4
        with:
          name: lyco-npm-notices-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/universal/src/npm-notices.json
            apps/universal/package-lock.json
            apps/universal/third-party/npm-notice-supplements.json
          retention-days: 7
      - name: Retain resolved dependency lock for reproducible builds
        uses: actions/upload-artifact@v4
        with:
          name: lyco-universal-dependency-lock-${{ github.run_id }}
          path: apps/universal/package-lock.json
          retention-days: 7
      - run: node --test ../../tests/release-publishing.test.js ../../tests/third-party-notices.test.js ../../tests/product-version.test.js
      - run: python3 scripts/test_android_signature.py
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs ../../tests/mobile-route-policy.test.mjs ../../tests/mobile-rtc-policy.test.mjs
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-web
      - name: Upload React Native Web to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$RUNNER_TEMP/LYCO-RN-Web.tar.gz" dist-web
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-RN-Web.tar.gz"

  android:
    if: ${{ !inputs.ios_device && !inputs.paid_routes_candidate && !inputs.network_probe_candidate && !inputs.native_engine_probe }}
    name: Android standalone preview / signed candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      # Ubuntu GitHub-hosted runner already provides the Android SDK; avoid legacy 'tools' package.
      - run: npm ci --no-audit --no-fund
      - name: Collect original installed JavaScript dependency notices
        run: node scripts/collect-npm-notices.mjs
      - name: Retain the exact offline notice bundle for this build
        uses: actions/upload-artifact@v4
        with:
          name: lyco-npm-notices-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/universal/src/npm-notices.json
            apps/universal/package-lock.json
            apps/universal/third-party/npm-notice-supplements.json
          retention-days: 7
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs ../../tests/mobile-route-policy.test.mjs ../../tests/mobile-rtc-policy.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build and integrate the Android subscription core from source
        working-directory: mobile/core
        run: |
          bash build-native.sh android
          go test -tags with_quic,with_utls -count=1 ./...
          python3 install-android.py
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Prepare private signing key for an explicitly dispatched candidate
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYKEY'
          import os, base64
          from pathlib import Path
          target=Path(os.environ['RUNNER_TEMP'])/'lyco-release.p12'
          key=os.environ.get('ANDROID_KEYSTORE_BASE64','')
          if not key: raise SystemExit('Android signing key is not configured')
          target.write_bytes(base64.b64decode(key,validate=True))
          target.chmod(0o600)
          PYKEY
      - name: Compile a standalone Android preview without production secrets
        if: github.event_name != 'workflow_dispatch' || !inputs.signed_android
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --stacktrace
      - name: Compile an explicitly dispatched signed Android candidate
        if: github.event_name == 'workflow_dispatch' && inputs.signed_android
        env:
          LYCO_ANDROID_KEYSTORE: ${{ runner.temp }}/lyco-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --init-script ../scripts/android-signing.gradle --no-daemon --stacktrace
      - name: Verify Android signature and retain standalone preview
        env:
          LYCO_REQUIRE_RELEASE_SIGNATURE: ${{ inputs.signed_android }}
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk" | tee "$RUNNER_TEMP/ANDROID-SIGNATURE.txt"
          python3 scripts/verify-android-signature.py "$RUNNER_TEMP/ANDROID-SIGNATURE.txt" ../../resources/signing/android-release-certificate.pem
          "${signer%/*}/aapt" dump badging "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk" > "$RUNNER_TEMP/ANDROID-PACKAGE.txt"
          python3 scripts/verify-built-version.py android "$RUNNER_TEMP/ANDROID-PACKAGE.txt" "$RUNNER_TEMP/ANDROID-VERSION-PROVENANCE.json"
          cd "$RUNNER_TEMP"
          sha256sum LYCO-Browser-Android-preview.apk ANDROID-SIGNATURE-PROVENANCE.json ANDROID-VERSION-PROVENANCE.json > ANDROID-SHA256SUMS.txt
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned mobile UI test driver
        run: bash ../../tests/mobile/install-maestro.sh
      - name: Enable KVM for native Android acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native Android A/B storage, reopen and real proxy acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tests/mobile/run-native.sh android
      - name: Retain original Android native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-android-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-android
          include-hidden-files: true
          retention-days: 7
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/lyco-release.p12"
      - name: Retain Android candidate for owner review
        if: github.event_name == 'pull_request' || inputs.signed_android
        uses: actions/upload-artifact@v4
        with:
          name: lyco-android-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LYCO-Browser-Android-preview.apk
            ${{ runner.temp }}/ANDROID-SHA256SUMS.txt
            ${{ runner.temp }}/ANDROID-SIGNATURE.txt
            ${{ runner.temp }}/ANDROID-SIGNATURE-PROVENANCE.json
            ${{ runner.temp }}/ANDROID-VERSION-PROVENANCE.json
            ${{ runner.temp }}/ANDROID-PACKAGE.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android APK to GitHub prerelease
        if: github.event_name != 'pull_request' && !inputs.signed_android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-Android-preview.apk"

  ios-simulator:
    if: ${{ !inputs.signed_android && !inputs.ios_device && !inputs.paid_routes_candidate && !inputs.network_probe_candidate && !inputs.native_engine_probe }}
    name: iOS 26 simulator unsigned app · no signing
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - name: Display GitHub runner Xcode environment
        run: xcodebuild -version
      - run: npm ci --no-audit --no-fund
      - name: Collect original installed JavaScript dependency notices
        run: node scripts/collect-npm-notices.mjs
      - name: Retain the exact offline notice bundle for this build
        uses: actions/upload-artifact@v4
        with:
          name: lyco-npm-notices-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/universal/src/npm-notices.json
            apps/universal/package-lock.json
            apps/universal/third-party/npm-notice-supplements.json
          retention-days: 7
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs ../../tests/mobile-route-policy.test.mjs ../../tests/mobile-rtc-policy.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build and integrate the Apple subscription core from source
        working-directory: mobile/core
        run: |
          set -euo pipefail
          bash build-native.sh apple
          go test -tags with_quic,with_utls -count=1 ./...
          mkdir -p ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
          tar xzf "$RUNNER_TEMP/lyco-tunnel-apple.tar.gz" -C ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Compile standalone unsigned simulator app on Actions (not an IPA)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building application scheme: $SCHEME (not the first Pods workspace scheme)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LYCO_iOS" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          test -d "$APP"
          python3 ../scripts/verify-built-version.py ios-simulator "$APP/Info.plist" "$RUNNER_TEMP/IOS-SIMULATOR-VERSION-PROVENANCE.json"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Install pinned mobile UI test driver
        run: bash ../../tests/mobile/install-maestro.sh
      - name: Boot an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PYSIM'
          import json,os
          from pathlib import Path
          devices=json.loads((Path(os.environ['RUNNER_TEMP'])/'simulators.json').read_text())['devices']
          phones=[x for group in devices.values() for x in group if x['name'].startswith('iPhone') and x.get('isAvailable')]
          if not phones: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('LYCO_IOS_SIMULATOR='+phones[0]['udid']+'\n')
          PYSIM
      - name: Native iOS A/B storage, reopen and real proxy acceptance
        run: |
          set -euo pipefail
          xcrun simctl boot "$LYCO_IOS_SIMULATOR" || xcrun simctl bootstatus "$LYCO_IOS_SIMULATOR" -b
          xcrun simctl bootstatus "$LYCO_IOS_SIMULATOR" -b
          export LYCO_IOS_APP=$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          bash ../../tests/mobile/run-native.sh ios
      - name: Retain original iOS native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-ios-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-ios
          include-hidden-files: true
          retention-days: 7
      - name: Upload iOS simulator build to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"

      - name: Retain simulator preview for review only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-simulator-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LYCO-Browser-iOS-simulator.zip
            ${{ runner.temp }}/IOS-SIMULATOR-VERSION-PROVENANCE.json
          retention-days: 7

  ios-device:
    if: github.event_name == 'workflow_dispatch' && inputs.ios_device && !inputs.signed_android && !inputs.paid_routes_candidate && !inputs.network_probe_candidate && !inputs.native_engine_probe
    name: iPhone ARM64 unsigned device archive · signing and runtime review required
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --no-audit --no-fund
      - name: Collect original installed JavaScript dependency notices
        run: node scripts/collect-npm-notices.mjs
      - name: Retain the exact offline notice bundle for this build
        uses: actions/upload-artifact@v4
        with:
          name: lyco-npm-notices-${{ github.job }}-${{ github.run_id }}
          path: |
            apps/universal/src/npm-notices.json
            apps/universal/package-lock.json
            apps/universal/third-party/npm-notice-supplements.json
          retention-days: 7
      - run: npx tsc --noEmit
      - run: node --experimental-strip-types --test ../../tests/mobile-proxy-endpoint.test.mjs ../../tests/mobile-subscription.test.mjs ../../tests/mobile-billing.test.mjs ../../tests/mobile-route-policy.test.mjs ../../tests/mobile-rtc-policy.test.mjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: mobile/core/go.sum
      - name: Build Apple network core from pinned source
        working-directory: mobile/core
        run: |
          set -euo pipefail
          bash build-native.sh apple
          go test -tags with_quic,with_utls -count=1 ./...
          mkdir -p ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
          tar xzf "$RUNNER_TEMP/lyco-tunnel-apple.tar.gz" -C ../../apps/universal/modules/lyco-mobile-browser/ios/Frameworks
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Compile iPhone device application without signing credentials
        run: |
          set -euo pipefail
          cd ios
          pod install
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/LYCO_Device" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify device platform and package unsigned signing input
        run: bash ../../scripts/ci-package-ios-device.sh
      - name: Retain unsigned device archive and build provenance
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-device-unsigned-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/LYCO-Browser-iOS-device-unsigned.ipa
            ${{ runner.temp }}/IOS-DEVICE-PROVENANCE.json
            ${{ runner.temp }}/IOS-DEVICE-VERSION-PROVENANCE.json
            ${{ runner.temp }}/IOS-DEVICE-SHA256SUMS.txt
            ${{ runner.temp }}/ios-device-platform.txt
          if-no-files-found: error
          retention-days: 7

  android-paid-routes:
    if: ${{ inputs.paid_routes_candidate != '' && !inputs.network_probe_candidate && !inputs.native_engine_probe }}
    name: Actual signed Android saved-node acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      GH_TOKEN: ${{ github.token }}
      LYCO_PAID_CANDIDATE_RUN: ${{ inputs.paid_routes_candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Download only a successful signed candidate with unchanged runtime sources
        run: |
          set -euo pipefail
          [[ "$LYCO_PAID_CANDIDATE_RUN" =~ ^[0-9]{5,20}$ ]]
          gh run watch "$LYCO_PAID_CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LYCO_PAID_CANDIDATE_RUN" > "$RUNNER_TEMP/lyco-paid-source-run.json"
          candidate_sha=$(python3 -c 'import json,sys;x=json.load(open(sys.argv[1]));assert x["conclusion"]=="success";print(x["head_sha"])' "$RUNNER_TEMP/lyco-paid-source-run.json")
          git fetch --no-tags origin "$candidate_sha"
          git diff --exit-code "$candidate_sha" HEAD -- apps/universal mobile/core src/product-version.js
          mkdir -p "$RUNNER_TEMP/lyco-paid-candidate" "$RUNNER_TEMP/lyco-paid-legacy" "$RUNNER_TEMP/lyco-mobile-paid"
          gh run download "$LYCO_PAID_CANDIDATE_RUN" -R "$GITHUB_REPOSITORY" -n "lyco-android-candidate-$LYCO_PAID_CANDIDATE_RUN" -D "$RUNNER_TEMP/lyco-paid-candidate"
          gh run download 40630265066 -R "$GITHUB_REPOSITORY" -n lyco-android-candidate-40630265066 -D "$RUNNER_TEMP/lyco-paid-legacy"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          for label in candidate legacy; do
            directory="$RUNNER_TEMP/lyco-paid-$label"
            (cd "$directory" && sha256sum -c ANDROID-SHA256SUMS.txt)
            "$signer" verify --verbose --print-certs "$directory/LYCO-Browser-Android-preview.apk" > "$RUNNER_TEMP/lyco-mobile-paid/$label-signature.txt"
            LYCO_REQUIRE_RELEASE_SIGNATURE=true python3 apps/universal/scripts/verify-android-signature.py "$RUNNER_TEMP/lyco-mobile-paid/$label-signature.txt" resources/signing/android-release-certificate.pem
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP']);candidate=root/'lyco-paid-candidate/LYCO-Browser-Android-preview.apk'
          run=json.loads((root/'lyco-paid-source-run.json').read_text())
          provenance=json.loads((root/'lyco-paid-candidate/ANDROID-VERSION-PROVENANCE.json').read_text())
          assert provenance['commit']==run['head_sha'] and provenance['run']==str(run['id'])
          with candidate.open('rb') as f: digest=hashlib.file_digest(f,'sha256').hexdigest()
          (root/'lyco-mobile-paid/candidate.json').write_text(json.dumps({'run':run['id'],'source':run['head_sha'],'sha256':digest,'runtime_source_diff':'empty','signed_certificate':'retained-owner-certificate','apk_modified':False},indent=2))
          PY
          echo "LYCO_CANDIDATE_APK=$RUNNER_TEMP/lyco-paid-candidate/LYCO-Browser-Android-preview.apk" >> "$GITHUB_ENV"
          echo "LYCO_LEGACY_APK=$RUNNER_TEMP/lyco-paid-legacy/LYCO-Browser-Android-preview.apk" >> "$GITHUB_ENV"
      - name: Install isolated CI device network tools and pinned UI driver
        run: |
          python3 -m venv "$RUNNER_TEMP/lyco-paid-mitm"
          "$RUNNER_TEMP/lyco-paid-mitm/bin/pip" install mitmproxy==12.2.1
          bash tests/mobile/install-maestro.sh
      - name: Enable KVM for disposable native device acceptance
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify default TLS, actual old-APK upgrade, persisted nodes, negative routing and native revocation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -writable-system
          script: bash tests/mobile/paid/run-paid.sh
      - name: Retain actual paid-routing observations without private CA or storage databases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-paid-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-paid
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Clean private disposable certificate and storage copies
        if: always()
        run: rm -rf "$RUNNER_TEMP/lyco-paid-private-ca" "$RUNNER_TEMP/lyco-paid-private-storage"

  android-network-probe:
    if: ${{ inputs.network_probe_candidate != '' && !inputs.native_engine_probe }}
    name: Actual signed Android native RTC boundary probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      LYCO_NETWORK_CANDIDATE_RUN: ${{ inputs.network_probe_candidate }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1, persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Read successful signed candidate and refuse changed product sources
        env:
          GH_TOKEN: ${{ github.token }}
          LYCO_PAID_CANDIDATE_RUN: ${{ inputs.paid_routes_candidate }}
        run: |
          test -z "$LYCO_PAID_CANDIDATE_RUN"
          bash tests/mobile/network/download-candidate.sh
      - name: Build only a separate plain WebView positive control with matching target SDK
        run: bash tests/mobile/network/build-control.sh
      - name: Prepare owned TURN TCP and real data-channel peer
        run: bash tests/mobile/network/prepare-peer.sh
      - name: Check network fixture syntax before the native observation
        run: |
          python3 -m py_compile tests/mobile/network/fixture.py tests/mobile/network/turn_peer.py tests/mobile/network/assert-evidence.py
          node --check tests/mobile/network/rtc-page.js
          bash -n tests/mobile/network/run-probe.sh
      - name: Install pinned native UI driver
        run: bash tests/mobile/install-maestro.sh
      - name: Enable KVM for actual native observations
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Observe healthy and stopped product RTC with independent direct controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tests/mobile/network/run-probe.sh
      - name: Preserve original RTC, TCP, STUN, provider and visible UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-mobile-network-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-network
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Remove disposable control signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lyco-network-control-private"

  android-native-engine-probe:
    if: ${{ inputs.native_engine_probe }}
    name: Standalone Gecko native policy experiment · not the product
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {contents: read}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Require an isolated experiment dispatch
        env:
          SIGNED: ${{ inputs.signed_android }}
          IOS: ${{ inputs.ios_device }}
          PAID: ${{ inputs.paid_routes_candidate }}
          NETWORK: ${{ inputs.network_probe_candidate }}
        run: test "$SIGNED" = false && test "$IOS" = false && test -z "$PAID" && test -z "$NETWORK"
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13', cache-disabled: true}
      - name: Build the standalone release-mode engine experiment
        run: bash tests/mobile/engine/build-probe.sh
      - name: Prepare owned TURN and peer, then check fixture syntax
        run: |
          bash tests/mobile/network/prepare-peer.sh
          python3 -m py_compile tests/mobile/network/fixture.py tests/mobile/network/turn_peer.py tests/mobile/network/assert-evidence.py
          node --check tests/mobile/network/rtc-page.js
          bash -n tests/mobile/engine/run-probe.sh
      - name: Enable KVM for native engine observations
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native before-after controls, empty frames, TURN and real loopback targets
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash tests/mobile/engine/run-probe.sh
      - name: Preserve original experiment binary, native observations and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyco-native-engine-experiment-${{ github.run_id }}
          path: ${{ runner.temp }}/lyco-mobile-network
          retention-days: 7
          if-no-files-found: warn
      - name: Remove experiment signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/lyco-engine-private"
