name: React Native Universal · Android iOS Web (GitHub Actions only)

on:
  push:
    branches: [main]
    paths:
      - 'apps/universal/**'
      - '.github/workflows/build-universal.yml'
      - 'tests/mobile-*.mjs'
  pull_request:
    branches: [main]
    paths: ['apps/universal/**', 'tests/mobile-*.mjs', 'scripts/ci-publish-release.sh', '.github/workflows/build-universal.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/universal

jobs:
  web:
    name: React Native Web / Windows macOS Linux shared UI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: node --test ../../tests/release-publishing.test.js
      - run: node --test ../../tests/mobile-proxy-endpoint.test.mjs
      - run: npx tsc --noEmit
      - run: npx expo export --platform web --output-dir dist-web
      - name: Upload React Native Web to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar czf "$RUNNER_TEMP/LYCO-RN-Web.tar.gz" dist-web
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-RN-Web.tar.gz"

  android:
    name: Android arm64/x64 debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      # Ubuntu GitHub-hosted runner already provides the Android SDK; avoid legacy 'tools' package.
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test ../../tests/mobile-proxy-endpoint.test.mjs
      - run: npx expo prebuild --clean --platform android --non-interactive
      - name: Compile Android test APK on Actions
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload Android APK to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/LYCO-Browser-Android-debug.apk"
          bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-Android-debug.apk"

  ios-simulator:
    name: iOS 26 simulator unsigned app · no signing
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Display GitHub runner Xcode environment
        run: xcodebuild -version
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: node --test ../../tests/mobile-proxy-endpoint.test.mjs
      - run: npx expo prebuild --clean --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
      - name: Compile unsigned simulator app on Actions (not an IPA)
        run: |
          set -euo pipefail
          cd ios
          WORKSPACE="$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)"
          test -n "$WORKSPACE"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building application scheme: $SCHEME (not the first Pods workspace scheme)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/LYCO_iOS" CODE_SIGNING_ALLOWED=NO build
          APP="$(find "$RUNNER_TEMP/LYCO_iOS/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"
      - name: Upload iOS simulator build to GitHub prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ../../scripts/ci-publish-release.sh "$RUNNER_TEMP/LYCO-Browser-iOS-simulator.zip"

      - name: Retain simulator preview for review only
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/LYCO-Browser-iOS-simulator.zip
          retention-days: 7
