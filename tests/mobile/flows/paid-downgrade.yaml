appId: top.lain42.lycobrowser
---
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: "无法读取本地环境列表，请重新打开应用后再修改环境"
    timeout: 30000
- tapOn: "环境管理"
- scrollUntilVisible:
    element: "保存环境"
    direction: DOWN
- assertVisible:
    text: "保存环境"
    enabled: false
- takeScreenshot: paid-downgrade-refused
