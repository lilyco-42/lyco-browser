appId: top.lain42.lycobrowser
---
- runFlow:
    file: create.yaml
    env:
      NAME: mobile-C
      URL: ${DIRECT_ORIGIN}/probe?owner=mobile-C
- runFlow:
    file: open.yaml
    env:
      NAME: mobile-C
- assertNotVisible: "LYCO verified mobile-C"
- waitForAnimationToEnd:
    timeout: 15000
- assertNotVisible: "LYCO verified mobile-C"
- takeScreenshot: stopped-proxy
- tapOn: "关闭环境"
