appId: top.lain42.lycobrowser
---
- tapOn: "环境管理"
- scrollUntilVisible:
    element:
      id: "环境名称"
    direction: UP
- tapOn:
    id: "环境名称"
- inputText: ${NAME}
- assertVisible: ${NAME}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: "首页 URL"
    direction: DOWN
- tapOn:
    id: "首页 URL"
- eraseText
- inputText: ${URL}
- assertVisible: ${URL.split('?').join('\\?').split('.').join('\\.')}
- pressKey: Enter
- tapOn: "保存环境"
