// Read configuration after ordinary product plugins have configured the app.
// No SDK/plugin override and no changes to metadata tasks or their outcomes.
gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    // Init scripts also observe included plugin builds, which have no app.
    if (app == null) return
    def android = app.extensions.findByName('android')
    def plugin = app.plugins.findPlugin('com.android.application')
    def version = plugin.class.classLoader.loadClass('com.android.Version')
        .getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
    def output = new File(System.getenv('RUNNER_TEMP'), 'lyco-gecko-product-compat/actual-gradle-model.json')
    def androidProjects = gradle.rootProject.allprojects.findAll {
        it.extensions.findByName('android') != null
    }.collect { candidate ->
        def dsl = candidate.extensions.getByName('android')
        [path: candidate.path, compileSdkHash: dsl.compileSdkVersion,
         minSdk: dsl.defaultConfig.minSdk?.toString(),
         targetSdk: dsl.defaultConfig.targetSdk?.toString()]
    }.sort { it.path }
    output.parentFile.mkdirs()
    output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        gradleVersion: gradle.gradleVersion,
        androidGradlePluginVersion: version,
        compileSdk: android.compileSdk,
        compileSdkHash: android.compileSdkVersion,
        minSdk: android.defaultConfig.minSdk?.toString(),
        targetSdk: android.defaultConfig.targetSdk?.toString(),
        projectNames: gradle.rootProject.allprojects.collect { it.path }.sort(),
        androidProjects: androidProjects,
        task: ':app:checkReleaseAarMetadata',
        scope: 'Actual configured product model, not native compilation or runtime'
    ]))
    if (System.getenv('LYCO_PRODUCT_COMPILE_REQUESTED') == 'true') {
        assert androidProjects.any { it.path == ':expo' }
        assert androidProjects.every { it.compileSdkHash == 'android-37.2' } :
            'Every candidate Android module must use the actual requested platform'
    }
}
